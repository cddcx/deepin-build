# CM3588-NAS 板卡配置
# 参考 Armbian: config/boards/cm3588-nas.conf (或类似 NAS 板卡)

BOARD_NAME="CM3588 NAS"
BOARD_SOC="rk3588"
BOARD_FAMILY="rockchip-rk3588"

# U-Boot 配置
# CM3588 使用 rock5-rk3588_defconfig 或通用 rk3588 defconfig
UBOOT_DEFCONFIG="rock5-rk3588_defconfig"
UBOOT_REPO="https://github.com/u-boot/u-boot"
UBOOT_BRANCH="v2025.07"

# 内核配置
KERNEL_DTB="rk3588-cm3588-nas.dtb"
KERNEL_OVERLAYS=""
KERNEL_REPO="https://github.com/armbian/linux-rockchip"
KERNEL_BRANCH="rk-6.1-rkr5.1"
KERNEL_DEFCONFIG="rockchip_linux_defconfig"

# DDR 固件 - 留空让脚本自动搜索
DDR_BIN=""

# NAS 场景额外包（chroot 中安装，容错）
EXTRA_PACKAGES="samba,nfs-common,openssh-server,hdparm,smartmontools,ntfs-3g,mdadm,lvm2"
