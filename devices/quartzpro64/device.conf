# QuartzPro64 板卡配置
# 参考 Armbian: config/boards/quartzpro64.conf

BOARD_NAME="QuartzPro64"
BOARD_SOC="rk3588"
BOARD_FAMILY="rockchip-rk3588"

# U-Boot 配置
UBOOT_DEFCONFIG="quartzpro64-rk3588_defconfig"
UBOOT_REPO="https://github.com/u-boot/u-boot"
UBOOT_BRANCH="v2025.07"

# 内核配置
KERNEL_DTB="rk3588-quartzpro64.dtb"
KERNEL_OVERLAYS=""
KERNEL_REPO="https://github.com/armbian/linux-rockchip"
KERNEL_BRANCH="rk-6.1-rkr5.1"
KERNEL_DEFCONFIG="rockchip_linux_defconfig"

# DDR 固件 - 留空让脚本自动搜索
DDR_BIN=""

# 额外包
EXTRA_PACKAGES="pciutils,usbutils"
