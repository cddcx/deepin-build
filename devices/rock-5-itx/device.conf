# Rock 5 ITX 板卡配置
# 主线 U-Boot 已原生支持 ROCK 5 ITX

BOARD_NAME="ROCK 5 ITX"
BOARD_SOC="rk3588"

UBOOT_DEFCONFIG="rock-5-itx-rk3588_defconfig"
UBOOT_REPO="https://github.com/u-boot/u-boot"
UBOOT_BRANCH="v2025.07"

KERNEL_DTB="rk3588-rock-5-itx.dtb"
KERNEL_OVERLAYS="rockchip-rk3588-panthor-gpu.dtbo"
KERNEL_REPO="https://github.com/armbian/linux-rockchip"
KERNEL_BRANCH="rk-6.1-rkr5.1"
KERNEL_DEFCONFIG="rockchip_linux_defconfig"

# DDR 固件 - 留空让脚本自动搜索最新版本
DDR_BIN=""

# 额外包（在 chroot 中安装，容错处理）
# Rockchip 相关: rockchip-mpp-drm, rockchip-mpp-sample
# 系统工具: pciutils, usbutils
EXTRA_PACKAGES="pciutils,usbutils"
